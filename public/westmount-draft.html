<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Westmount Draft — Yeti</title>
<style>
:root {
  --bg:#f5f4f0; --card:#fff; --ink:#1a1a1a; --muted:#6a6a64;
  --line:#ddd; --ice:#3a7ca5; --go:#2d8a5e; --warn:#8a6d1b; --bad:#c45c5c;
  --me:#eef3f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#f5f4f0ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:6px 12px}
h1{font-size:13px;margin:0;font-weight:650;color:var(--muted)}
header .tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
header details.fold{font-size:12px;color:var(--muted)}
header details.fold summary{cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button,input{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit}
.order-row{display:flex;gap:4px;flex-wrap:nowrap;align-items:center;margin-top:4px}
.order-row label{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);min-width:0;flex:1}
.order-row select{width:100%;min-width:0;padding:4px 2px;font-size:12px}
button{background:#fff}
button.primary{background:var(--go);color:#fff;font-weight:700;border-color:var(--go)}
button.ghost{background:transparent}
.tabs{display:flex;gap:6px;margin:0}
.tabs button[aria-current="true"]{background:var(--ice);color:#fff;border-color:var(--ice)}
main{padding:10px 12px 90px}
.clock{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.clock.mine{border-color:var(--ice);background:#eef3f7}
.clock .who{font-size:26px;line-height:1.05;font-weight:800;letter-spacing:-0.03em;margin:0 0 2px}
.clock .onclock{color:var(--muted);font-size:12px;margin:0 0 8px}
.clock .take{font-size:14px;font-weight:700;margin:0}
.clock .row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.clock .why{width:100%;margin:0;font-size:13px;color:var(--muted);line-height:1.35}
.clock .take-actions{margin:0}
.clock .take-actions button{padding:5px 10px;font-size:13px}
.clock .alts{display:flex;flex-wrap:wrap;gap:6px}
.clock .alts button{font-size:12px;padding:2px 4px;background:transparent;color:var(--muted);border:0;text-decoration:underline;text-underline-offset:2px}
.help{width:100%;margin:0;font-size:12px;color:var(--muted)}
.help summary{cursor:pointer;color:var(--ice);font-weight:600}
.help .small{margin:8px 0}
.suggest{color:var(--ice);font-weight:600}
tr.rec{background:#bfe3c9}
tr.rec td{font-weight:650}
tr.rec td:first-child{color:var(--go);font-weight:800}
.tag.sug{background:var(--go);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;position:sticky;top:52px;background:var(--bg)}
tr.gone{opacity:.35}
tr.me{background:var(--me)}
tr.avail:active{background:#ecebe6}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;background:#eee;color:var(--muted)}
.tag.g{background:#e4eef6;color:#2a5070}
.tag.assumed{background:#f3eee4;color:#8a6d1b}
.tag.traded{background:#ece6f3;color:#5a4a78}
.tag.family{background:#e8f3ec;color:#2d5a40}
tr.yeti td:first-child{box-shadow:inset 3px 0 0 #c5d4de}
.pts{font-variant-numeric:tabular-nums;font-weight:700}
.team-grid{display:grid;gap:8px}
@media(min-width:700px){.team-grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.card.mine{border-color:#b8cddb}
.small{color:var(--muted);font-size:12px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#f5f4f0f2;border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#sim-n{width:4.4em}
#results h2{font-size:14px;margin:16px 0 6px;font-weight:650}
#results .lead{margin:0 0 10px;color:var(--muted);font-size:13px}
#results table.compact{font-size:12px}
#results table.compact th,#results table.compact td{padding:5px 6px}
.standings-wrap{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.standings{width:100%;font-size:12px}
.standings th,.standings td{padding:6px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.standings thead th{position:static;top:auto;background:var(--card);color:var(--muted);font-size:11px}
.standings tbody tr{cursor:pointer}
.standings tbody tr:active{background:#ecebe6}
.standings tr.me{background:var(--me)}
.standings .win{font-weight:700;color:var(--ice)}
.charts{display:grid;gap:10px;padding:8px 10px 10px;border-top:1px solid var(--line)}
@media(min-width:700px){.charts{grid-template-columns:1fr 1fr}}
.chart-title{font-size:11px;color:var(--muted);font-weight:600;margin:0 0 4px}
.chart svg{display:block;width:100%;height:auto}
.results-charts{margin:8px 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.card.warn-g{box-shadow:inset 0 0 0 1px #e6d7a8}
.empty-net{color:var(--warn);font-size:12px;margin:4px 0}
.player-line{display:flex;gap:6px;flex-wrap:wrap;padding:3px 0;border-bottom:1px solid #eee}
.player-line:last-child{border-bottom:0}
</style>
</head>

</header>
<main>

    <div class="small">Skaters: last-year + 5-year blend as expected 28-game points, then positional VORP vs the last starter (9 F / 4 D / 1 G per team), times attendance (GP/32), then convex so elites swing games. Goalies: 18 + 0.6×max(0, 40−age) — modest talent (Martin/Lach above backups), not empty-net first-round VORP. Everyone gets a starter (5×1). A goalie's pick value is only the extra quality you keep by taking him now vs the net you still get if you pass (Martin minus the leftover). Last year Steven took Peter at 17 and Martin went 18, then sat through Walter/Gironne/Lach and took Yarrow at 67. If you are the last team without a net, that extra is zero: take skaters. Only jump if passing means you get shut out. A 2nd goalie is −28.</div>
    <div class="small">Captains re-draft last-year teammates: +12 if they drafted them, +8 if they only played together. After a post-draft trade, skip the +12 and use the season team only (+8). Yeti +18 on McAlears (suggested pick prefers family within ~15 of BPA). Hawks +10 Angelini/Orsini/Ciampini. Phil (Flyers) +22 on Yarrow.</div>
    <div class="small">After last year’s draft, a four-man swap: Lach + Friedman (drafted Kings) to Yeti; Yarrow + Uhthoff (drafted Yeti) to Kings. Yeti’s season/playoff goalie was Lach. Friedman’s attendance is 10/32 (10 GP of ~32, missed half / likely again) so the suggested pick does not treat him as a full-season 5-point skater. League undervalued goalies vs our model.</div>
    <div class="small">Playoffs: Devils (R4 Martin) won the final vs Kings. Yeti (Lach) beat Flyers 5–4 then barely lost to Devils in the semis. Goalies matter, but last year they clustered R4–R7 and Yeti took the leftover at 67. Suggested Pick copies that: sit through the run, take skaters, take Yarrow last unless passing gets you no net at all.</div>
    <div class="small">Standings: last-year value + remaining-pick EV (model win% / proj 1st) — not a real odds line. R# is last year’s draft ADP.</div>
    <div class="small">Proj is the opening talent board (frozen). Pick is where they actually went. ADP is last year.</div>
    <div class="small">Captains (Steven, Ciampini, Emile, Phil, Mashaal) are drafted, not pre-seated. Draft Sept 17. New-player showcase Sept 14.</div>
  </details>`;
  if (!left){ el.innerHTML = "<strong>Draft complete.</strong> Check Teams."+help; return; }
  if (!rec){ el.innerHTML = `<div class="onclock">On the clock · pick ${state.pick+1}</div>`+help; return; }
  const headline = `Suggested Pick: ${shortName(rec.name)}`;
  const altBtns = alts.map(p=>`<button type="button" data-pick-id="${p.id}">${shortName(p.name)} · ${posOf(p)} · ${score(p).toFixed(1)}</button>`).join("");
  const runner = alts[0];
  el.innerHTML = `<div class="who">${teamLabel(team)}</div>
    <div class="onclock">On the clock · pick ${state.pick+1} · ${left} left</div>
    <div class="row2">
      <div class="take">${shortName(rec.name)} · ${posOf(rec)} · ${whyPick(rec, team)}</div>
      <div class="take-actions">
        <button class="primary" type="button" data-pick-id="${rec.id}">Pick</button>
      </div>
      ${altBtns?`<div class="alts">${altBtns}</div>`:""}
    </div>
    <div class="why">${whyExplain(rec, team, runner)}</div>
    ${help}`;
}

function renderStandings(st){
  const rows = st.ranked.map(t=>{
    const me = t==="Yeti" ? " me":"";
    return `<tr class="${me}" data-team="${t}">
      <td>${st.rank[t]}</td>
      <td><strong>${t}</strong></td>
      <td class="win">${Math.round(st.win[t]*100)}%</td>
      <td>${st.now[t].toFixed(1)}</td>
      <td>${goalieName(t)}</td>
    </tr>`;
  }).join("");
  document.getElementById("standings").innerHTML = `<table class="standings"><thead><tr>
    <th>#</th><th>Team</th><th title="model chance of finishing 1st">win%</th><th>Now</th><th>G</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}
function svgBars(rows, opts){
  const w = 320, rowH = 22, left = 52, right = 46, top = 2;
  const h = top + rows.length * rowH;
  const max = Math.max(opts.max || 0, ...rows.map(r=>r.value), 0.001);
  const inner = w - left - right;
  const bars = rows.map((r,i)=>{
    const y = top + i*rowH;
    const bw = Math.max(2, (r.value/max)*inner);
    const fill = r.me ? "#3a7ca5" : "#c5c4be";
    const val = opts.fmt(r.value);
    return `<text x="0" y="${y+14}" font-size="11" fill="#6a6a64">${r.label}</text>
      <rect x="${left}" y="${y+4}" width="${bw.toFixed(1)}" height="12" rx="3" fill="${fill}"/>
      <text x="${left+inner+6}" y="${y+14}" font-size="11" fill="#1a1a1a">${val}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMid meet" role="img">${bars}</svg>`;
}

function renderBoard(){
  const sort = document.getElementById("sort").value;
  const filter = document.getElementById("filter").value;
  let rows = PLAYERS.slice();
  rows.sort((a,b)=>{
    if (sort==="name") return a.name.localeCompare(b.name);
    if (sort==="age") return a.age-b.age;
    if (sort==="pts") return (b.pts-a.pts) || (b.ppg-a.ppg);
    if (sort==="ppg") return (b.ppg-a.ppg) || (b.pts-a.pts);
    if (sort==="g") return (b.g-a.g) || (b.pts-a.pts);
    if (sort==="adp") return (a.lyPick||99) - (b.lyPick||99) || a.name.localeCompare(b.name);
    if (sort==="proj") return PROJ_RANK[a.id]-PROJ_RANK[b.id];
    return score(b)-score(a);
  });
  rows = rows.filter(p=>{
    const pos = posOf(p);
    if (filter==="avail") return !state.taken[p.id];
    if (filter==="F") return pos==="F";
    if (filter==="D") return pos==="D";
    if (filter==="G") return pos==="G";
    if (filter==="new") return !p.returning && p.role==="skater";
    if (filter==="yeti") return p.lyTeam==="Yeti";
    if (filter==="assumed") return !!p.assumed;
    return true;
  });
  const recId = (recommend()||{}).id;
  const html = [`<table><thead><tr><th></th><th>Player</th><th>P</th><th>Proj</th><th>Pick</th><th>ADP</th><th>Val</th><th>PTS</th><th>P/G</th><th>5Y</th><th>GP</th></tr></thead><tbody>`];
  for (const p of rows){
    const gone = !!state.taken[p.id];
    const cls = (gone ? "gone" : "avail") + (p.lyTeam==="Yeti" ? " yeti" : "") + (!gone && p.id===recId ? " rec" : "");
    const tags = [];
    if (!gone && p.id===recId) tags.push('<span class="tag sug">suggested</span>');
    if (CAPTAINS.has(p.id)) tags.push('<span class="tag">captain</span>');
    if (gone) tags.push(`<span class="tag">${state.taken[p.id]}</span>`);
    if (p.assumed) tags.push('<span class="tag assumed">assumed</span>');
    if (p.role==="goalie") tags.push('<span class="tag g">G</span>');
    if (FAMILY.has(p.id)) tags.push('<span class="tag family">family</span>');
    if (p.tradedAfterDraft) tags.push('<span class="tag traded">traded</span>');
    if (p.id==="Friedman, David") tags.push('<span class="tag assumed">missed half / likely again</span>');
    if (p.playedD) tags.push('<span class="tag assumed">D last year → F</span>');
    html.push(`<tr class="${cls}" data-id="${p.id}">
      <td>${gone?"—":"+"}</td>
      <td>${shortName(p.name)} <span class="small">${p.age?p.age:""}${p.lyTeam?(p.age?" · ":"")+p.lyTeam:""}</span> ${tags.join(" ")}</td>
      <td>${posOf(p)}</td>
      <td>${PROJ_RANK[p.id]}</td>
      <td>${state.history.indexOf(p.id)>=0?state.history.indexOf(p.id)+1:"—"}</td>
      <td>${p.lyRound?("R"+p.lyRound):"—"}</td>
      <td class="pts">${score(p).toFixed(1)}</td>
      <td>${p.returning?p.pts:"—"}</td>
      <td>${p.returning?p.ppg:"—"}</td>
      <td>${p.y5ppg!=null?p.y5ppg.toFixed(2):"—"}</td>
      <td>${p.returning?p.gp:"—"}</td>
    </tr>`);
  }
  html.push("</tbody></table>");
  document.getElementById("board").innerHTML = html.join("");
}

function teamCharts(st){
  const oddsRows = st.ranked.map(t=>({label:t, value:st.win[t], me:t==="Yeti"}));
  const talRows = st.ranked.map(t=>({label:t, value:st.proj[t], me:t==="Yeti"}));
  return `<div class="charts">
    <div><div class="chart-title">Odds · model 1st</div>${svgBars(oddsRows,{fmt:v=>Math.round(v*100)+"%"})}</div>
    <div><div class="chart-title">Talent · proj</div>${svgBars(talRows,{fmt:v=>v.toFixed(1)})}</div>
  </div>`;
}
function renderTeams(st){
  const wrap = document.getElementById("teams");
  wrap.innerHTML = teamCharts(st) + st.ranked.map(t=>{
    const r = rosterPickOrder(t);
    const mine = t==="Yeti" ? " mine":"";

      <div class="small">Now ${st.now[t].toFixed(1)} · Proj ${st.proj[t].toFixed(1)} · ${lyPts(t)} LY pts · ${r.length} players</div>
      ${warn}${list||"<div class='small'>empty</div>"}
    </div>`;
  }).join("");
}

const SIM_TEMP = 8;
const SIM_TOP = 4;
const SIM_ROUNDS = 14;
let simResults = null;

function softmaxSample(pool, team, r, k, temp, pickNum, rosters){
  const ctx = { pool, pickNum, rosters };
  const ranked = pool.slice().sort((a,b)=> pickValueOn(b,team,r,ctx) - pickValueOn(a,team,r,ctx) || a.name.localeCompare(b.name));
  const top = ranked.slice(0, Math.min(k, ranked.length));
  if (!top.length) return null;
  const weights = top.map(p=> Math.exp(pickValueOn(p, team, r, ctx) / temp));
  const sum = weights.reduce((s,w)=>s+w,0);
  let u = Math.random() * sum;
  for (let i=0;i<top.length;i++){
    u -= weights[i];
    if (u <= 0) return top[i];
  }
  return top[top.length-1];
}

function runOneSim(){
  const rosters = Object.fromEntries(TEAMS.map(t=>[t,[]]));
  const picks = [];
  const pool = PLAYERS.slice();
  const total = SIM_ROUNDS * TEAMS.length;
  for (let i=0; i<total && pool.length; i++){
    const team = teamAtPick(i);
    const r = rosters[team];
    // Yeti: tight noise (usually Suggested Pick). Others: same math, more noise.
    const p = team==="Yeti"
      ? softmaxSample(pool, team, r, 2, 4, i, rosters)
      : softmaxSample(pool, team, r, 3, 6, i, rosters);
    if (!p) break;
    pool.splice(pool.indexOf(p), 1);
    r.push(p);
    picks.push({id:p.id, team, pick:i+1});
  }
  const talent = {};
  for (const t of TEAMS) talent[t] = rosters[t].reduce((s,p)=>s+score(p),0);
  const ranked = TEAMS.slice().sort((a,b)=> (talent[b]-talent[a]) || a.localeCompare(b));
  const rank = {};
  ranked.forEach((t,i)=> rank[t]=i+1);
  return {picks, talent, rank, winner: ranked[0]};
}

function simCount(){
  let n = parseInt(document.getElementById("sim-n").value, 10);
  if (!Number.isFinite(n)) n = 25;
  n = Math.max(1, Math.min(200, n));
  document.getElementById("sim-n").value = String(n);
  return n;
}

function runSims(){
  const n = simCount();
  const slot = state.slot;
  const first = Object.fromEntries(TEAMS.map(t=>[t,0]));
  const rankSum = Object.fromEntries(TEAMS.map(t=>[t,0]));
  const talentSum = Object.fromEntries(TEAMS.map(t=>[t,0]));
  const byId = {};
  for (const p of PLAYERS){
    byId[p.id] = {id:p.id, name:p.name, drafted:0, pickSum:0, yeti:0, yetiPickSum:0, teams:{}};
  }
  for (let s=0;s<n;s++){
    const sim = runOneSim();
    first[sim.winner]++;
    for (const t of TEAMS){
      rankSum[t] += sim.rank[t];
      talentSum[t] += sim.talent[t];
    }
    for (const pk of sim.picks){
      const st = byId[pk.id];
      st.drafted++;
      st.pickSum += pk.pick;
      st.teams[pk.team] = (st.teams[pk.team]||0) + 1;
      if (pk.team==="Yeti"){
        st.yeti++;
        st.yetiPickSum += pk.pick;
      }
    }
  }
  const teams = TEAMS.map(t=>({
    team: t,
    pctFirst: first[t]/n,
    avgRank: rankSum[t]/n,
    avgTalent: talentSum[t]/n,
  })).sort((a,b)=> (b.pctFirst-a.pctFirst) || (a.avgRank-b.avgRank) || a.team.localeCompare(b.team));
  const haul = Object.values(byId)
    .filter(st=> st.yeti/n >= 0.20)
    .map(st=>({
      id: st.id,
      name: st.name,
      pct: st.yeti/n,
      avgPick: st.yetiPickSum/st.yeti,
    }))
    .sort((a,b)=> (b.pct-a.pct) || (a.avgPick-b.avgPick) || a.name.localeCompare(b.name));
  const players = Object.values(byId)
    .filter(st=> st.drafted>0)
    .map(st=>{
      let common = "", commonN = -1;
      for (const [t,c] of Object.entries(st.teams)){
        if (c>commonN || (c===commonN && t.localeCompare(common)<0)){
          common = t; commonN = c;
        }
      }
      return {
        id: st.id,
        name: st.name,
        avgPick: st.pickSum/st.drafted,
        common,
        pctYeti: st.yeti/n,
      };
    })
    .sort((a,b)=> (a.avgPick-b.avgPick) || a.name.localeCompare(b.name));
  simResults = {n, slot, teams, haul, players};
  state.view = "results";
  render();
}

function pct(x){ return Math.round(x*100)+"%"; }

function renderResults(){
  const el = document.getElementById("results");
  if (!simResults){
    el.innerHTML = `<p class="lead">Run sims from the bar.</p>`;
    return;
  }
  const r = simResults;
  const teamRows = r.teams.map(t=>`<tr class="${t.team==="Yeti"?"me":""}">
      <td><strong>${t.team}</strong></td>
      <td>${pct(t.pctFirst)}</td>
      <td>${t.avgRank.toFixed(1)}</td>
      <td>${t.avgTalent.toFixed(1)}</td>
    </tr>`).join("");
  const haulRows = r.haul.map(p=>`<tr>
      <td>${shortName(p.name)}</td>
      <td>${pct(p.pct)}</td>
      <td>${p.avgPick.toFixed(1)}</td>
    </tr>`).join("");
  const playerRows = r.players.map(p=>`<tr class="${p.common==="Yeti"?"me":""}">
      <td>${shortName(p.name)}</td>
      <td>${p.avgPick.toFixed(1)}</td>
      <td>${p.common}</td>
      <td>${pct(p.pctYeti)}</td>
    </tr>`).join("");
  el.innerHTML = `<p class="lead">${r.n} sims · Steven slot ${r.slot} · Yeti follows Suggested Pick, others noisy</p>
    <h2>Teams</h2>
    <table><thead><tr><th>Team</th><th>% 1st</th><th>avg rank</th><th>avg talent</th></tr></thead><tbody>${teamRows}</tbody></table>
    <div class="results-charts"><div class="charts">
      <div><div class="chart-title">Odds · % 1st</div>${svgBars(r.teams.map(t=>({label:t.team, value:t.pctFirst, me:t.team==="Yeti"})),{fmt:v=>Math.round(v*100)+"%"})}</div>
      <div><div class="chart-title">Talent · avg</div>${svgBars(r.teams.map(t=>({label:t.team, value:t.avgTalent, me:t.team==="Yeti"})),{fmt:v=>v.toFixed(1)})}</div>
    </div></div>
    <h2>Yeti haul</h2>
    ${r.haul.length?`<table><thead><tr><th>Player</th><th>% sims</th><th>avg pick</th></tr></thead><tbody>${haulRows}</tbody></table>`:`<p class="lead">No player went to Yeti in ≥20% of sims.</p>`}
    <h2>Player board</h2>
    <table class="compact"><thead><tr><th>Player</th><th>avg pick</th><th>most common team</th><th>% to Yeti</th></tr></thead><tbody>${playerRows}</tbody></table>`;
}

function render(){
  deriveSlot();
  syncOrderSelects();
  const st = computeStandings();
  renderClock();
  renderStandings(st);
  renderBoard();
  renderTeams(st);
  renderResults();
  const view = state.view;
  const onBoard = view==="board";
  const onTeams = view==="teams";
  const onResults = view==="results";
  document.getElementById("clock").hidden = onResults;
  document.getElementById("standings").hidden = onResults;
  document.getElementById("board").hidden = !onBoard;
  document.getElementById("teams").hidden = !onTeams;
  document.getElementById("results").hidden = !onResults;
  document.getElementById("tab-board").setAttribute("aria-current", onBoard? "true":"false");
  document.getElementById("tab-teams").setAttribute("aria-current", onTeams? "true":"false");
  document.getElementById("tab-results").setAttribute("aria-current", onResults? "true":"false");
}

document.getElementById("board").addEventListener("click", e=>{
  const tr = e.target.closest("tr[data-id]");
  if (!tr) return;
  pick(tr.dataset.id, teamOnClock());
});
document.getElementById("clock").addEventListener("click", e=>{
  const btn = e.target.closest("[data-pick-id]");
  if (!btn) return;
  pick(btn.dataset.pickId, teamOnClock());
});
document.getElementById("standings").addEventListener("click", e=>{
  const tr = e.target.closest("tr[data-team]");
  if (!tr) return;
  state.view = "teams";
  render();
  const card = document.getElementById("team-"+tr.dataset.team);
  if (card) card.scrollIntoView({behavior:"smooth", block:"start"});
});
document.getElementById("btn-undo").onclick = undo;
document.getElementById("btn-reset").onclick = ()=>{ if(confirm("Reset the whole draft?")) reset(); };
document.getElementById("btn-mock").onclick = mock;
document.getElementById("order-row").addEventListener("change", e=>{
  const sel = e.target.closest("select[data-ord]");
  if (!sel) return;
  const i = +sel.dataset.ord;
  const team = sel.value;
  const cur = state.order[i];
  if (team === cur) return;
  const j = state.order.indexOf(team);
  state.order[i] = team;
  if (j >= 0) state.order[j] = cur;
  deriveSlot();
  save();
  render();
});
document.getElementById("sort").onchange = render;
document.getElementById("filter").onchange = render;
document.getElementById("tab-board").onclick = ()=>{ state.view="board"; render(); };
document.getElementById("tab-teams").onclick = ()=>{ state.view="teams"; render(); };
document.getElementById("tab-results").onclick = ()=>{ state.view="results"; render(); };
document.getElementById("btn-sim").onclick = runSims;
load(); render();
</script>
