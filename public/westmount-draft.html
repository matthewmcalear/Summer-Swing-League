<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Westmount Draft — Yeti</title>
<style>
:root {
  --bg:#f5f4f0; --card:#fff; --ink:#1a1a1a; --muted:#6a6a64;
  --line:#ddd; --ice:#3a7ca5; --go:#2d8a5e; --warn:#8a6d1b; --bad:#c45c5c;
  --me:#eef3f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#f5f4f0ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:6px 12px}
h1{font-size:13px;margin:0;font-weight:650;color:var(--muted)}
header .tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
header details.fold{font-size:12px;color:var(--muted)}
header details.fold summary{cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button,input{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit}
.order{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 0}
.order-slot{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 6px;flex:1;min-width:132px}
.order-slot .n{font-size:11px;color:var(--muted);font-weight:700;min-width:0.9em}
.order-slot .nm{font-size:12px;font-weight:650;flex:1;white-space:nowrap}
.order-slot button{padding:2px 7px;line-height:1.1;font-size:12px}
.order-slot.sel{border-color:var(--ice);background:#eef3f7}
button{background:#fff}
button.primary{background:var(--go);color:#fff;font-weight:700;border-color:var(--go)}
button.ghost{background:transparent}
.tabs{display:flex;gap:6px;margin:0}
.tabs button[aria-current="true"]{background:var(--ice);color:#fff;border-color:var(--ice)}
main{padding:10px 12px 90px}
.clock{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.clock.mine{border-color:var(--ice);background:#eef3f7}
.clock .who{font-size:26px;line-height:1.05;font-weight:800;letter-spacing:-0.03em;margin:0 0 2px}
.clock .onclock{color:var(--muted);font-size:12px;margin:0 0 8px}
.clock .take{font-size:14px;font-weight:700;margin:0}
.clock .row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.clock .why{width:100%;margin:0;font-size:13px;color:var(--muted);line-height:1.35}
.clock .take-actions{margin:0}
.clock .take-actions button{padding:5px 10px;font-size:13px}
.clock .alts{display:flex;flex-wrap:wrap;gap:6px}
.clock .alts button{font-size:12px;padding:2px 4px;background:transparent;color:var(--muted);border:0;text-decoration:underline;text-underline-offset:2px}
.help{width:100%;margin:0;font-size:12px;color:var(--muted)}
.help summary{cursor:pointer;color:var(--ice);font-weight:600}
.help .small{margin:8px 0}
.suggest{color:var(--ice);font-weight:600}
tr.rec{background:#bfe3c9}
tr.rec td{font-weight:650}
tr.rec td:first-child{color:var(--go);font-weight:800}
.tag.sug{background:var(--go);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;position:sticky;top:52px;background:var(--bg)}
tr.gone{opacity:.35}
tr.me{background:var(--me)}
tr.avail:active{background:#ecebe6}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;background:#eee;color:var(--muted)}
.tag.g{background:#e4eef6;color:#2a5070}
.tag.assumed{background:#f3eee4;color:#8a6d1b}
.tag.traded{background:#ece6f3;color:#5a4a78}
.tag.family{background:#e8f3ec;color:#2d5a40}
tr.yeti td:first-child{box-shadow:inset 3px 0 0 #c5d4de}
.pts{font-variant-numeric:tabular-nums;font-weight:700}
.team-grid{display:grid;gap:8px}
@media(min-width:700px){.team-grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.card.mine{border-color:#b8cddb}
.small{color:var(--muted);font-size:12px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#f5f4f0f2;border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#sim-n{width:4.4em}
#results h2{font-size:14px;margin:16px 0 6px;font-weight:650}
#results .lead{margin:0 0 10px;color:var(--muted);font-size:13px}
#results table.compact{font-size:12px}
#results table.compact th,#results table.compact td{padding:5px 6px}
.standings-wrap{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.standings{width:100%;font-size:12px}
.standings th,.standings td{padding:6px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.standings thead th{position:static;top:auto;background:var(--card);color:var(--muted);font-size:11px}
.standings tbody tr{cursor:pointer}
.standings tbody tr:active{background:#ecebe6}
.standings tr.me{background:var(--me)}
.standings .win{font-weight:700;color:var(--ice)}
.charts{display:grid;gap:10px;padding:8px 10px 10px;border-top:1px solid var(--line)}
@media(min-width:700px){.charts{grid-template-columns:1fr 1fr}}
.chart-title{font-size:11px;color:var(--muted);font-weight:600;margin:0 0 4px}
.chart svg{display:block;width:100%;height:auto}
.results-charts{margin:8px 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.card.warn-g{box-shadow:inset 0 0 0 1px #e6d7a8}
.empty-net{color:var(--warn);font-size:12px;margin:4px 0}
.player-line{display:flex;gap:6px;flex-wrap:wrap;padding:3px 0;border-bottom:1px solid #eee}
.player-line:last-child{border-bottom:0}
.live-rosters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:8px 0 2px}
.live-col{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 6px;min-width:0}
.live-col.on{border-color:var(--ice);background:#eef3f7}
.live-col.yeti{box-shadow:inset 3px 0 0 #c5d4de}
.live-col h3{margin:0 0 3px;font-size:11px;font-weight:750;letter-spacing:-0.02em}
.live-col ol{margin:0;padding:0;list-style:none}
.live-col li{font-size:11px;line-height:1.25;padding:1px 0;display:flex;gap:4px;border-bottom:1px solid #f0f0ec}
.live-col li:last-child{border-bottom:0}
.live-col .n{color:var(--muted);min-width:1.15em;font-variant-numeric:tabular-nums}
.live-col .g{color:#2a5070}
.live-col .none{color:#bbb;font-size:11px}
</style>
</head>

</div>

const TEAMS = ["Yeti","Devils","Kings","Flyers","Hawks"];
const CAPTAINS = new Set(["McAlear, Steven","Ciampini, Adam","Murciano, Emile","Mashaal, Alexander"]);
const TEAM_CAPTAIN = {Yeti:"Steven", Devils:"Emile", Kings:"Mashaal", Flyers:"Phil", Hawks:"Ciampini"};
const TEAM_CAPTAIN_ID = {Yeti:"McAlear, Steven", Devils:"Murciano, Emile", Kings:"Mashaal, Alexander", Hawks:"Ciampini, Adam"};
function teamLabel(t){ return TEAM_CAPTAIN[t] ? t+" ("+TEAM_CAPTAIN[t]+")" : t; }
function ownCaptainId(team){ return TEAM_CAPTAIN_ID[team] || null; }
function captainSelfBonus(p, team, ctx){
  if (p.id !== ownCaptainId(team)) return 0;
  const others = (ctx.pool||[]).filter(x=>x.id!==p.id);
  if (!others.length) return 18;
  let bestSc = -Infinity;
  for (const x of others){ const s=score(x); if (s>bestSc) bestSc=s; }
  const gap = bestSc - score(p);
  return Math.max(-12, Math.min(18, 18 - gap));
}
const KEY = "wsl-draft-v12";

const FAMILY = new Set(["McAlear, Daniel","McAlear, Matthew","McAlear, Thomas"]);
const HAWKS_CORE = new Set(["Angelini, Christopher","Angelini, Michael","Orsini, Mark","Ciampini, Adam"]);

function lastYearScore(p){
  return p.pts*0.6 + p.ppg*p.gp*0.4;
}
function y5Value(p){
  if (!p.y5gp) return null;
  let y5 = (p.y5pts / p.y5gp) * 28;
  if (p.y5gp < 20) {
    const t = p.y5gp / 20;
    y5 = t*y5 + (1-t)*18;
  }
  return y5;
}
function rawExpected(p){
  const y5 = y5Value(p);
  let raw;
  if (!p.returning && y5==null) raw = 8 + Math.max(0, 28-p.age)*0.3;
  else if (!p.returning && y5!=null) raw = y5;
  else {
    const ly = lastYearScore(p);
    if (y5==null) raw = ly;
    else {
      const w5 = Math.min(1, p.y5gp / 80);
      raw = (1 - 0.45*w5)*ly + (0.45*w5)*y5;
    }
  }
  if (p.playedD) raw *= 1.3;
  return raw;
}
function skaterSlot(p){
  return p.pos === "D" ? "D" : "F";
}
function attendanceR(p){
  if (p.returning && p.gp>0) return Math.min(1, p.gp/32);
  if (p.y5gp) return Math.min(1, (p.y5gp/5)/32);
  return 0.55;
}
function replacementLevels(){
  const fs = [], ds = [];
  for (const p of PLAYERS){
    if (p.role==="goalie") continue;
    const raw = rawExpected(p);
    if (skaterSlot(p)==="D") ds.push(raw);
    else fs.push(raw);
  }
  fs.sort((a,b)=>b-a);
  ds.sort((a,b)=>b-a);
  return {
    replF: fs.length ? fs[Math.min(44, fs.length-1)] : 0,
    replD: ds.length ? ds[Math.min(7, ds.length-1)] : 15, // 8th D (2nd pair), not Saleh
  };
}
const REPL = replacementLevels();
function score(p){
  if (p.role==="goalie") {
    const ageAdj = p.age>0 ? Math.max(0, 40 - p.age) * 0.6 : 0;
    return 18 + ageAdj; // Martin~29.4, Lach~28.8, Yarrow~19.8, Gironne~18 — not 1st-round talent
  }
  const raw = rawExpected(p);
  const vorp = raw - (skaterSlot(p)==="D" ? REPL.replD : REPL.replF);
  const talent = vorp * attendanceR(p);
  if (talent >= 0) return talent + 0.008 * talent * talent;
  return talent * 1.4;
}

const PROJ_RANK = {};
PLAYERS.slice().sort((a,b)=> (score(b)-score(a)) || a.name.localeCompare(b.name))
  .forEach((p,i)=> PROJ_RANK[p.id]=i+1);

function shortName(n){
  const [last, first] = n.split(",").map(s=>s.trim());
  return first ? first.split(" ")[0]+" "+last : n;
}
function posOf(p){ return p.role==="goalie" ? "G" : (p.pos || "?"); }

let state = {
  order: ["Devils","Kings","Flyers","Yeti","Hawks"],
  slot: 4,
  pick: 0,
  taken: {}, // id -> team
  history: [],
  view: "board",
};

function teamAtPick(pickNum){
  const n = TEAMS.length;
  const round = Math.floor(pickNum / n);
  const i = pickNum % n;
  const order = snakeOrder();
  return order[round % 2 === 0 ? i : n-1-i];
}
function teamOnClock(){ return teamAtPick(state.pick); }
function snakeOrder(){
  return state.order;
}
function deriveSlot(){
  const i = state.order.indexOf("Yeti");
  state.slot = i >= 0 ? i+1 : 4;
}
function renderOrder(){
  const el = document.getElementById("order-row");
  if (!el) return;
  el.innerHTML = (state.order||[]).map((t,i)=>`<div class="order-slot" data-i="${i}">
    <span class="n">${i+1}</span>
    <span class="nm">${teamLabel(t)}</span>
    <button type="button" data-move="-1" ${i===0?"disabled":""}>↑</button>
    <button type="button" data-move="1" ${i===4?"disabled":""}>↓</button>
  </div>`).join("");
}
function moveOrder(i, dir){
  const j = i + dir;
  if (j<0 || j>=state.order.length) return;
  const o = state.order.slice();
  const tmp = o[i]; o[i]=o[j]; o[j]=tmp;
  state.order = o;
  deriveSlot();
  save();
  render();
}
function swapOrder(i, j){
  if (i===j) return;
  const o = state.order.slice();
  const tmp = o[i]; o[i]=o[j]; o[j]=tmp;
  state.order = o;
  deriveSlot();
  save();
  render();
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if(s) Object.assign(state,s); } catch(e){}
  const def = ["Devils","Kings","Flyers","Yeti","Hawks"];
  if (!Array.isArray(state.order) || state.order.length !== 5) state.order = def.slice();
  const have = new Set(state.order);
  if (TEAMS.some(t=>!have.has(t))) state.order = def.slice();
  deriveSlot();
  renderOrder();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

function available(){ return PLAYERS.filter(p=>!state.taken[p.id]); }
function roster(team){
  const r = PLAYERS.filter(p=>state.taken[p.id]===team);
  return r;
}
function rosterPickOrder(team){
  const out = [];
  for (const id of state.history){
    if (state.taken[id]===team){
      const p = PLAYERS.find(x=>x.id===id);
      if (p) out.push(p);
    }
  }
  return out;
}
function nowValue(team){
  return roster(team).reduce((s,p)=>s+score(p),0);
}
function lyPts(team){
  return roster(team).reduce((s,p)=>s+(p.returning?p.pts:0),0);
}
function goalieName(team){
  const g = roster(team).find(p=>p.role==="goalie");
  return g ? shortName(g.name) : "—";
}
function computeStandings(){
  const extra = Object.fromEntries(TEAMS.map(t=>[t,0]));
  const simR = Object.fromEntries(TEAMS.map(t=>[t, roster(t).slice()]));
  const pool = PLAYERS.filter(p=>!state.taken[p.id]);
  let pick = state.pick;
  while (pool.length){
    const team = teamAtPick(pick);
    const r = simR[team];
    const best = chooseFrom(pool, team, r, pick, simR);
    if (!best) break;
    pool.splice(pool.indexOf(best),1);
    extra[team] += score(best);
    r.push(best);
    pick++;
  }
  const now = {}, proj = {}, win = {};
  let z = 0;
  const exps = {};
  for (const t of TEAMS){
    now[t] = nowValue(t);
    proj[t] = now[t] + extra[t];
    exps[t] = Math.exp(proj[t]/80);
    z += exps[t];
  }
  for (const t of TEAMS) win[t] = exps[t]/z;
  const ranked = TEAMS.slice().sort((a,b)=> (proj[b]-proj[a]) || (now[b]-now[a]) || a.localeCompare(b));
  const rank = {};
  ranked.forEach((t,i)=> rank[t]=i+1);
  return {now, proj, win, ranked, rank};
}
function politics(p, team){
  let b = 0;
  if (p.tradedAfterDraft) {
    if (p.lyTeam === team) b += 8;
  } else if (p.lyDraftTeam === team) b += 12;
  else if (p.lyTeam === team) b += 8;
  if (team==="Yeti" && FAMILY.has(p.id)) b += 18;
  if (team==="Hawks" && HAWKS_CORE.has(p.id)) b += 10;
  if (team==="Flyers" && p.id==="Yarrow, Evan") b += 22;
  return b;
}
function rostersFromState(){
  return Object.fromEntries(TEAMS.map(t=>[t, roster(t)]));
}
function remainingStarterGs(pool){
  return pool.filter(p=>p.role==="goalie").length;
}
function teamsNeedingG(rosters){
  let n = 0;
  for (const t of TEAMS){
    if (!(rosters[t]||[]).some(x=>x.role==="goalie")) n++;
  }
  return n;
}
function remainingGsSorted(pool){
  return pool.filter(p=>p.role==="goalie").slice().sort((a,b)=>score(b)-score(a));
}
function goalieScramble(pool, rosters){
  const remG = remainingStarterGs(pool);
  const needers = teamsNeedingG(rosters);
  return needers >= 2 && remG === 1;
}
function goalieIfPass(p, pool, rosters){
  const still = remainingGsSorted(pool).filter(x=>x.id!==p.id);
  const needers = teamsNeedingG(rosters);
  if (needers <= 1) return p;
  if (!still.length) return null;
  return still[still.length-1];
}
function goalieNeedBonus(p, pool, pickNum, rosters){
  const needers = teamsNeedingG(rosters);
  const remG = remainingStarterGs(pool);
  if (needers <= 1) return -score(p);
  if (remG <= 1 && needers >= 2) return 40;
  const pass = goalieIfPass(p, pool, rosters);
  if (!pass) return 40;
  return -score(p) + (score(p) - score(pass));
}
function needBumpOn(p, r, ctx){
  const d = r.filter(x=>posOf(x)==="D").length;
  const g = r.filter(x=>posOf(x)==="G").length;
  let bump = 0;
  if (posOf(p)==="G" && g>=1) bump += -28;
  else if (posOf(p)==="G" && g===0) bump += goalieNeedBonus(p, ctx.pool, ctx.pickNum, ctx.rosters);
  else if (posOf(p)==="D" && d===0) bump += 8;
  bump += captainSelfBonus(p, ctx.team, ctx);
  return bump;
}
function liveCtx(){
  return { pool: available(), pickNum: state.pick, rosters: rostersFromState(), team: teamOnClock() };
}
function pickValueOn(p, team, r, ctx){ return score(p) + needBumpOn(p, r, ctx) + politics(p, team); }
function chooseFrom(pool, team, r, pickNum, rosters){
  const ctx = { pool, pickNum, rosters, team };
  let best = null, bestV = -Infinity;
  for (const p of pool){
    const v = pickValueOn(p, team, r, ctx);
    if (v>bestV){ bestV=v; best=p; }
  }
  return best;
}
function rankedPicks(){
  const team = teamOnClock();
  const r = roster(team);
  const ctx = liveCtx();
  return available().slice().sort((a,b)=> pickValueOn(b,team,r,ctx) - pickValueOn(a,team,r,ctx));
}
function recommend(){
  const team = teamOnClock();
  return chooseFrom(available(), team, roster(team), state.pick, rostersFromState());
}
function whyPick(p, team){
  if (p.id === ownCaptainId(team)) return "own captain";
  if (team==="Yeti" && FAMILY.has(p.id)) return "family";
  if (team==="Flyers" && p.id==="Yarrow, Evan") return "Phil takes Yarrow";
  if (p.tradedAfterDraft) {
    if (p.lyTeam === team) return "last-year "+team;
  } else if (p.lyDraftTeam === team || p.lyTeam === team) return "last-year "+team;
  if (team==="Hawks" && HAWKS_CORE.has(p.id)) return "Hawks core";
  const bump = needBumpOn(p, roster(team), liveCtx());
  if (posOf(p)==="G" && bump>=40) return "don't get shut out";
  if (posOf(p)==="G" && bump>0) return "goalie gap";
  if (posOf(p)==="D" && bump===8) return "need a D";
  return "best value";
}
function whyExplain(p, team, runner){
  const r = roster(team);
  const ctx = liveCtx();
  if (p.id === ownCaptainId(team)){
    const vs = runner ? ` Next is ${shortName(runner.name)}.` : "";
    return `Captains draft themselves. ${shortName(p.name)} is ${teamLabel(team)}'s C. Board is in his talent range.`+vs;
  }
  const pv = pickValueOn(p, team, r, ctx);
  const need = needBumpOn(p, r, ctx);
  const pol = politics(p, team);
  const sc = score(p);
  const vs = runner
    ? ` Next is ${shortName(runner.name)} (${posOf(runner)}, pick value ${pickValueOn(runner,team,r,ctx).toFixed(1)}).`
    : "";
  if (p.role==="goalie") {
    if (need >= 40) return `Last starter on the board and another team still needs a net. Take ${shortName(p.name)} or you get shut out.`+vs;
    if (need <= -20) return `You are the last team without a goalie, so this net is yours anyway. That is the Steven wait: take a skater.`+vs;
    if (need > 0) return `Goalie value is only the extra quality vs the leftover net (${need.toFixed(1)}). ${shortName(p.name)} talent ${sc.toFixed(1)}.`+vs;
  }
  if (team==="Yeti" && FAMILY.has(p.id))
    return `${shortName(p.name)} is family (+18). Talent ${sc.toFixed(1)}, pick value ${pv.toFixed(1)}. Last year Steven took Peter at 17 over Martin.`+vs;
  if (need===8 && posOf(p)==="D")
    return `First defenseman. ${shortName(p.name)} talent ${sc.toFixed(1)} plus the +8 hole. Pick value ${pv.toFixed(1)}.`+vs;
  if (pol>=8)
    return `${whyPick(p,team)} (+${pol}). Talent ${sc.toFixed(1)}, pick value ${pv.toFixed(1)}.`+vs;
  return `Highest leftover talent (${sc.toFixed(1)}). Pick value ${pv.toFixed(1)} is score + need + politics.`+vs;
}
function recStat(p){
  if (p.role==="goalie") return "goalie";
  const bits = [];
  if (p.returning) bits.push(p.pts+" LY pts");
  if (p.y5ppg!=null) bits.push(p.y5ppg.toFixed(2)+" 5Y P/G");
  return bits.join(" · ") || "no stats";
}

function pick(id, team){
  if (state.taken[id]) return;
  state.taken[id] = team;
  state.history.push(id);
  state.pick++;
  save(); render();
}
function undo(){
  const id = state.history.pop();
  if (!id) return;
  delete state.taken[id];
  state.pick = Math.max(0, state.pick-1);
  save(); render();
}
function reset(){
  state.taken = {}; state.history=[]; state.pick=0;
  simResults = null;
  save(); render();
}

function mock(){
  reset();
  const pool = available();
  const total = pool.length;
  for (let i=0;i<total;i++){
    const team = teamOnClock();
    const rec = recommend();
    if (!rec) break;
    pick(rec.id, team);
  }
}

function svgBars(rows, opts){
  const w = 320, rowH = 22, left = 52, right = 46, top = 2;
  const h = top + rows.length * rowH;
  const max = Math.max(opts.max || 0, ...rows.map(r=>r.value), 0.001);
  const inner = w - left - right;
  const bars = rows.map((r,i)=>{
    const y = top + i*rowH;
    const bw = Math.max(2, (r.value/max)*inner);
    const fill = r.me ? "#3a7ca5" : "#c5c4be";
    const val = opts.fmt(r.value);
    return `<text x="0" y="${y+14}" font-size="11" fill="#6a6a64">${r.label}</text>
      <rect x="${left}" y="${y+4}" width="${bw.toFixed(1)}" height="12" rx="3" fill="${fill}"/>
      <text x="${left+inner+6}" y="${y+14}" font-size="11" fill="#1a1a1a">${val}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMid meet" role="img">${bars}</svg>`;
}

  rows.sort((a,b)=>{
    if (sort==="name") return a.name.localeCompare(b.name);
    if (sort==="age") return a.age-b.age;
    if (sort==="pts") return (b.pts-a.pts) || (b.ppg-a.ppg);
    if (sort==="ppg") return (b.ppg-a.ppg) || (b.pts-a.pts);
    if (sort==="g") return (b.g-a.g) || (b.pts-a.pts);
    if (sort==="adp") return (a.lyPick||99) - (b.lyPick||99) || a.name.localeCompare(b.name);
    if (sort==="proj") return PROJ_RANK[a.id]-PROJ_RANK[b.id];
    return score(b)-score(a);
  });
  rows = rows.filter(p=>{
    const pos = posOf(p);
    if (filter==="avail") return !state.taken[p.id];

    if (filter==="D") return pos==="D";

    if (p.role==="goalie") tags.push('<span class="tag g">G</span>');
    if (FAMILY.has(p.id)) tags.push('<span class="tag family">family</span>');
    if (p.tradedAfterDraft) tags.push('<span class="tag traded">traded</span>');
    if (p.playedD) tags.push('<span class="tag assumed">D last year → F</span>');
    html.push(`<tr class="${cls}" data-id="${p.id}">
      <td>${gone?"—":"+"}</td>
      <td>${shortName(p.name)} <span class="small">${p.age?p.age:""}${p.lyTeam?(p.age?" · ":"")+p.lyTeam:""}</span> ${tags.join(" ")}</td>
      <td>${posOf(p)}</td>

  }
  html.push("</tbody></table>");

const SIM_TEMP = 8;
const SIM_TOP = 4;
const SIM_ROUNDS = 14;
let simResults = null;

function softmaxSample(pool, team, r, k, temp, pickNum, rosters){
  const ctx = { pool, pickNum, rosters, team };
  const ranked = pool.slice().sort((a,b)=> pickValueOn(b,team,r,ctx) - pickValueOn(a,team,r,ctx) || a.name.localeCompare(b.name));
  const top = ranked.slice(0, Math.min(k, ranked.length));
  if (!top.length) return null;
  const weights = top.map(p=> Math.exp(pickValueOn(p, team, r, ctx) / temp));
  const sum = weights.reduce((s,w)=>s+w,0);
  let u = Math.random() * sum;
  for (let i=0;i<top.length;i++){
    u -= weights[i];
    if (u <= 0) return top[i];
  }
  return top[top.length-1];
}

function runOneSim(){
  const rosters = Object.fromEntries(TEAMS.map(t=>[t,[]]));
  const picks = [];
  const pool = PLAYERS.slice();
  const total = SIM_ROUNDS * TEAMS.length;
  for (let i=0; i<total && pool.length; i++){
    const team = teamAtPick(i);
    const r = rosters[team];
    // Yeti: tight noise (usually Suggested Pick). Others: same math, more noise.
    const p = team==="Yeti"
      ? softmaxSample(pool, team, r, 2, 4, i, rosters)
      : softmaxSample(pool, team, r, 3, 6, i, rosters);
    if (!p) break;
    pool.splice(pool.indexOf(p), 1);
    r.push(p);
    picks.push({id:p.id, team, pick:i+1});
  }
  const talent = {};
  for (const t of TEAMS) talent[t] = rosters[t].reduce((s,p)=>s+score(p),0);
  const ranked = TEAMS.slice().sort((a,b)=> (talent[b]-talent[a]) || a.localeCompare(b));
  const rank = {};
  ranked.forEach((t,i)=> rank[t]=i+1);
  return {picks, talent, rank, winner: ranked[0]};
}

function simCount(){
  let n = parseInt(document.getElementById("sim-n").value, 10);
  if (!Number.isFinite(n)) n = 25;
  n = Math.max(1, Math.min(200, n));
  document.getElementById("sim-n").value = String(n);
  return n;
}

function runSims(){
  const n = simCount();
  const slot = state.slot;
  const first = Object.fromEntries(TEAMS.map(t=>[t,0]));
  const rankSum = Object.fromEntries(TEAMS.map(t=>[t,0]));
  const talentSum = Object.fromEntries(TEAMS.map(t=>[t,0]));
  const byId = {};
  for (const p of PLAYERS){
    byId[p.id] = {id:p.id, name:p.name, drafted:0, pickSum:0, yeti:0, yetiPickSum:0, teams:{}};
  }
  for (let s=0;s<n;s++){
    const sim = runOneSim();
    first[sim.winner]++;
    for (const t of TEAMS){
      rankSum[t] += sim.rank[t];
      talentSum[t] += sim.talent[t];
    }
    for (const pk of sim.picks){
      const st = byId[pk.id];
      st.drafted++;
      st.pickSum += pk.pick;
      st.teams[pk.team] = (st.teams[pk.team]||0) + 1;
      if (pk.team==="Yeti"){
        st.yeti++;
        st.yetiPickSum += pk.pick;
      }
    }
  }
  const teams = TEAMS.map(t=>({
    team: t,
    pctFirst: first[t]/n,
    avgRank: rankSum[t]/n,
    avgTalent: talentSum[t]/n,
  })).sort((a,b)=> (b.pctFirst-a.pctFirst) || (a.avgRank-b.avgRank) || a.team.localeCompare(b.team));
  const haul = Object.values(byId)
    .filter(st=> st.yeti/n >= 0.20)
    .map(st=>({
      id: st.id,
      name: st.name,
      pct: st.yeti/n,
      avgPick: st.yetiPickSum/st.yeti,
    }))
    .sort((a,b)=> (b.pct-a.pct) || (a.avgPick-b.avgPick) || a.name.localeCompare(b.name));
  const players = Object.values(byId)
    .filter(st=> st.drafted>0)
    .map(st=>{
      let common = "", commonN = -1;
      for (const [t,c] of Object.entries(st.teams)){
        if (c>commonN || (c===commonN && t.localeCompare(common)<0)){
          common = t; commonN = c;
        }
      }
      return {
        id: st.id,
        name: st.name,
        avgPick: st.pickSum/st.drafted,
        common,
        pctYeti: st.yeti/n,
      };
    })
    .sort((a,b)=> (a.avgPick-b.avgPick) || a.name.localeCompare(b.name));
  simResults = {n, slot, teams, haul, players};
  state.view = "results";
  render();
}

function pct(x){ return Math.round(x*100)+"%"; }

function renderResults(){
  const el = document.getElementById("results");
  if (!simResults){
    el.innerHTML = `<p class="lead">Run sims from the bar.</p>`;
    return;
  }
  const r = simResults;
  const teamRows = r.teams.map(t=>`<tr class="${t.team==="Yeti"?"me":""}">
      <td><strong>${t.team}</strong></td>
      <td>${pct(t.pctFirst)}</td>
      <td>${t.avgRank.toFixed(1)}</td>
      <td>${t.avgTalent.toFixed(1)}</td>
    </tr>`).join("");
  const haulRows = r.haul.map(p=>`<tr>
      <td>${shortName(p.name)}</td>
      <td>${pct(p.pct)}</td>
      <td>${p.avgPick.toFixed(1)}</td>
    </tr>`).join("");
  const playerRows = r.players.map(p=>`<tr class="${p.common==="Yeti"?"me":""}">
      <td>${shortName(p.name)}</td>
      <td>${p.avgPick.toFixed(1)}</td>
      <td>${p.common}</td>
      <td>${pct(p.pctYeti)}</td>
    </tr>`).join("");
  el.innerHTML = `<p class="lead">${r.n} sims · Steven slot ${r.slot} · Yeti follows Suggested Pick, others noisy</p>
    <h2>Teams</h2>
    <table><thead><tr><th>Team</th><th>% 1st</th><th>avg rank</th><th>avg talent</th></tr></thead><tbody>${teamRows}</tbody></table>
    <div class="results-charts"><div class="charts">
      <div><div class="chart-title">Odds · % 1st</div>${svgBars(r.teams.map(t=>({label:t.team, value:t.pctFirst, me:t.team==="Yeti"})),{fmt:v=>Math.round(v*100)+"%"})}</div>
      <div><div class="chart-title">Talent · avg</div>${svgBars(r.teams.map(t=>({label:t.team, value:t.avgTalent, me:t.team==="Yeti"})),{fmt:v=>v.toFixed(1)})}</div>
    </div></div>
    <h2>Yeti haul</h2>
    ${r.haul.length?`<table><thead><tr><th>Player</th><th>% sims</th><th>avg pick</th></tr></thead><tbody>${haulRows}</tbody></table>`:`<p class="lead">No player went to Yeti in ≥20% of sims.</p>`}
    <h2>Player board</h2>
    <table class="compact"><thead><tr><th>Player</th><th>avg pick</th><th>most common team</th><th>% to Yeti</th></tr></thead><tbody>${playerRows}</tbody></table>`;
}

function render(){
  deriveSlot();
  renderOrder();
  const st = computeStandings();
  renderClock();
  renderLiveRosters();
  renderStandings(st);
  renderBoard();
  renderTeams(st);
  renderResults();
  const view = state.view;
  const onBoard = view==="board";
  const onTeams = view==="teams";
  const onResults = view==="results";
  document.getElementById("clock").hidden = onResults;
  document.getElementById("live-rosters").hidden = !onBoard;
  document.getElementById("standings-fold").hidden = !onBoard;
  document.getElementById("standings").hidden = onResults;
  document.getElementById("board").hidden = !onBoard;
  document.getElementById("teams").hidden = !onTeams;
  document.getElementById("results").hidden = !onResults;
  document.getElementById("tab-board").setAttribute("aria-current", onBoard? "true":"false");
  document.getElementById("tab-teams").setAttribute("aria-current", onTeams? "true":"false");
  document.getElementById("tab-results").setAttribute("aria-current", onResults? "true":"false");
}

document.getElementById("board").addEventListener("click", e=>{
  const tr = e.target.closest("tr[data-id]");
  if (!tr) return;
  pick(tr.dataset.id, teamOnClock());
});
document.getElementById("clock").addEventListener("click", e=>{
  const btn = e.target.closest("[data-pick-id]");
  if (!btn) return;
  pick(btn.dataset.pickId, teamOnClock());
});
document.getElementById("standings").addEventListener("click", e=>{
  const tr = e.target.closest("tr[data-team]");
  if (!tr) return;
  state.view = "teams";
  render();
  const card = document.getElementById("team-"+tr.dataset.team);
  if (card) card.scrollIntoView({behavior:"smooth", block:"start"});
});
document.getElementById("btn-undo").onclick = undo;
document.getElementById("btn-reset").onclick = ()=>{ if(confirm("Reset the whole draft?")) reset(); };
document.getElementById("btn-mock").onclick = mock;
let orderPick = null;
document.getElementById("order-row").addEventListener("click", e=>{
  const btn = e.target.closest("button[data-move]");
  const slot = e.target.closest(".order-slot");
  if (btn && slot){
    moveOrder(+slot.dataset.i, +btn.dataset.move);
    orderPick = null;
    return;
  }
  if (!slot) return;
  const i = +slot.dataset.i;
  if (orderPick==null){
    orderPick = i;
    slot.classList.add("sel");
    return;
  }
  swapOrder(orderPick, i);
  orderPick = null;
});
document.getElementById("sort").onchange = render;
document.getElementById("filter").onchange = render;
document.getElementById("tab-board").onclick = ()=>{ state.view="board"; render(); };
document.getElementById("tab-teams").onclick = ()=>{ state.view="teams"; render(); };
document.getElementById("tab-results").onclick = ()=>{ state.view="results"; render(); };
document.getElementById("btn-sim").onclick = runSims;
load(); render();
</script>
</body>
</html>
